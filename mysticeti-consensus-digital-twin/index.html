  <title>Mysticeti Consensus Digital Twin — ESL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030914;
      --panel: #07111f;
      --cyan: #24d5ff;
      --violet: #8b5cf6;
      --green: #2dd4a7;
      --muted: #9eb1c7;
      --white: #f8fbff;
      --slide: 0;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 10%, rgba(36, 213, 255, .09), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, .09), transparent 32%),
        var(--bg);
      color: var(--white);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body.dragging { cursor: grabbing; }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: pan-y;
    }

    .deck {
      display: flex;
      width: 2200vw;
      height: 100%;
      transform: translate3d(calc(var(--slide) * -100vw), 0, 0);
      transition: transform 480ms cubic-bezier(.22, .8, .22, 1);
      will-change: transform;
    }

    body.dragging .deck { transition: none; }

    .slide {
      position: relative;
      flex: 0 0 100vw;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vw, 48px) clamp(12px, 5vw, 76px) clamp(28px, 4vw, 56px);
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 7% 5%;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(36, 213, 255, .035), rgba(139, 92, 246, .025));
      filter: blur(30px);
      pointer-events: none;
    }

    .slide img {
      position: relative;
      z-index: 1;
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      border-radius: clamp(5px, .7vw, 12px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .5), 0 0 0 1px rgba(133, 185, 230, .13);
      user-select: none;
      -webkit-user-drag: none;
    }

    .contact-actions {
      position: absolute;
      left: 50%;
      bottom: clamp(48px, 5.5vh, 72px);
      z-index: 3;
      display: flex;
      gap: 10px;
      transform: translateX(-50%);
    }

    .contact-actions a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid rgba(36, 213, 255, .55);
      border-radius: 999px;
      background: rgba(7, 17, 31, .94);
      color: var(--white);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
      text-decoration: none;
      font-size: clamp(11px, 1vw, 13px);
      font-weight: 700;
      white-space: nowrap;
    }

    .contact-actions a:hover,
    .contact-actions a:focus-visible {
      border-color: var(--green);
      outline: 2px solid rgba(45, 212, 167, .35);
      outline-offset: 2px;
    }

    .topbar {
      position: fixed;
      top: clamp(9px, 1.5vw, 18px);
      right: clamp(12px, 2vw, 26px);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .chip, .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      border: 1px solid rgba(158, 177, 199, .22);
      border-radius: 999px;
      background: rgba(7, 17, 31, .82);
      color: var(--white);
      box-shadow: 0 10px 35px rgba(0, 0, 0, .25);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-decoration: none;
      font: 600 12px/1 Inter, system-ui, sans-serif;
      letter-spacing: .02em;
    }

    .chip { padding: 0 14px; }
    .chip strong { color: var(--cyan); margin-right: 6px; }
    .icon-button { width: 38px; padding: 0; cursor: pointer; }
    .chip:hover, .icon-button:hover { border-color: rgba(36, 213, 255, .55); background: rgba(12, 28, 48, .94); }

    .nav {
      position: fixed;
      top: 50%;
      z-index: 30;
      width: clamp(42px, 4vw, 56px);
      height: clamp(42px, 4vw, 56px);
      border: 1px solid rgba(158, 177, 199, .24);
      border-radius: 50%;
      background: rgba(7, 17, 31, .82);
      color: var(--white);
      font: 500 clamp(30px, 3vw, 42px)/1 Inter, sans-serif;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transform: translateY(-50%);
      cursor: pointer;
      transition: opacity 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .nav:hover { border-color: var(--cyan); transform: translateY(-50%) scale(1.05); }
    .nav.prev { left: clamp(8px, 1.5vw, 22px); }
    .nav.next { right: clamp(8px, 1.5vw, 22px); }
    .nav[hidden] { display: none; }

    .progress-track {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      height: 5px;
      background: rgba(158, 177, 199, .11);
    }

    .progress {
      width: 4.5454545%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--green));
      box-shadow: 0 0 16px rgba(36, 213, 255, .45);
      transition: width 420ms cubic-bezier(.22, .8, .22, 1);
    }

    .counter {
      position: fixed;
      right: clamp(14px, 2vw, 28px);
      bottom: 15px;
      z-index: 35;
      min-width: 68px;
      padding: 8px 12px;
      border: 1px solid rgba(158, 177, 199, .2);
      border-radius: 999px;
      background: rgba(7, 17, 31, .78);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .swipe-hint {
      position: fixed;
      left: 50%;
      bottom: clamp(22px, 4.5vh, 44px);
      z-index: 34;
      transform: translateX(-50%);
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(7, 17, 31, .76);
      color: var(--muted);
      font-size: clamp(11px, 1vw, 13px);
      font-weight: 600;
      letter-spacing: .03em;
      animation: hint 1.8s ease-in-out infinite;
      transition: opacity 220ms ease;
      pointer-events: none;
    }

    .swipe-hint.hidden { opacity: 0; }

    @keyframes hint {
      0%, 100% { transform: translateX(-50%) translateX(-5px); }
      50% { transform: translateX(-50%) translateX(5px); }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 700px) {
      .slide { padding: 48px 8px 42px; }
      .slide img { border-radius: 4px; }
      .contact-actions { bottom: 56px; gap: 6px; }
      .contact-actions a { min-height: 34px; padding: 0 10px; }
      .chip.brand { display: none; }
      .nav { top: auto; bottom: 12px; transform: none; width: 40px; height: 40px; font-size: 28px; }
      .nav:hover { transform: scale(1.04); }
      .counter { bottom: 13px; right: 50%; transform: translateX(50%); }
      .swipe-hint { bottom: 62px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .deck, .progress, .nav { transition-duration: 0ms; }
      .swipe-hint { animation: none; }
    }

    @media print {
      html, body { overflow: visible; background: #fff; }
      .viewport { position: static; overflow: visible; }
      .deck { display: block; width: auto; transform: none !important; }
      .slide { width: 100%; height: auto; min-height: 100vh; page-break-after: always; padding: 0; background: #07111f; }
      .slide img { width: 100%; max-width: none; max-height: none; border-radius: 0; box-shadow: none; }
      .topbar, .nav, .progress-track, .counter, .swipe-hint { display: none !important; }
    }
  </style>
</head>
<body>

  <button class="nav prev" id="prev" type="button" aria-label="Previous slide">‹</button>
  <button class="nav next" id="next" type="button" aria-label="Next slide">›</button>
  <div class="swipe-hint" id="hint">← Swipe, drag, or use arrow keys →</div>
  <div class="counter" id="counter" aria-live="polite">1 / 24</div>
  <div class="progress-track" aria-hidden="true"><div class="progress" id="progress"></div></div>
  <div class="sr-only" id="announcement" aria-live="polite"></div>

  <script>
    (() => {
      const slides = [...document.querySelectorAll('.slide')];
      const total = slides.length;
      const deck = document.getElementById('deck');
      const viewport = document.getElementById('viewport');
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      const progress = document.getElementById('progress');
      const counter = document.getElementById('counter');
      const hint = document.getElementById('hint');
      const announcement = document.getElementById('announcement');
      const fullscreen = document.getElementById('fullscreen');
      const home = document.getElementById('home');
      let current = Math.max(0, Math.min(total - 1, Number(location.hash.replace('#slide-', '')) - 1 || 0));
      let startX = null;
      let pointerX = null;
      let dragging = false;

      function preloadAround(index) {
        [index - 1, index + 1, index + 2].forEach(i => {
          if (slides[i]) {
            const img = slides[i].querySelector('img');
            if (img && !img.complete) {
              const preload = new Image();
              preload.src = img.src;
            }
          }
        });
      }

      function render({ updateHash = true } = {}) {
        document.documentElement.style.setProperty('--slide', current);
        progress.style.width = `${((current + 1) / total) * 100}%`;
        counter.textContent = `${current + 1} / ${total}`;
        prev.hidden = current === 0;
        next.hidden = current === total - 1;
        hint.classList.toggle('hidden', current !== 0);
        const title = slides[current].dataset.title || `Slide ${current + 1}`;
        document.title = `${title} — Mysticeti Digital Twin`;
        announcement.textContent = `Slide ${current + 1} of ${total}: ${title}`;
        slides.forEach((slide, i) => slide.setAttribute('aria-hidden', i === current ? 'false' : 'true'));
        if (updateHash) history.replaceState(null, '', `#slide-${current + 1}`);
        preloadAround(current);
      }

      function go(index) {
        const nextIndex = Math.max(0, Math.min(total - 1, index));
        if (nextIndex === current) return;
        current = nextIndex;
        render();
      }

      prev.addEventListener('click', () => go(current - 1));
      next.addEventListener('click', () => go(current + 1));
      home.addEventListener('click', () => go(0));

      document.addEventListener('keydown', event => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (['ArrowRight', 'PageDown', ' '].includes(event.key)) {
          event.preventDefault();
          go(current + 1);
        } else if (['ArrowLeft', 'PageUp'].includes(event.key)) {
          event.preventDefault();
          go(current - 1);
        } else if (event.key === 'Home') {
          event.preventDefault();
          go(0);
        } else if (event.key === 'End') {
          event.preventDefault();
          go(total - 1);
        } else if (event.key.toLowerCase() === 'f') {
          event.preventDefault();
          toggleFullscreen();
        }
      });

      function beginDrag(x) {
        startX = x;
        pointerX = x;
        dragging = true;
        document.body.classList.add('dragging');
      }

      function moveDrag(x) {
        if (!dragging || startX === null) return;
        pointerX = x;
        const delta = x - startX;
        deck.style.transform = `translate3d(calc(${-current * 100}vw + ${delta}px), 0, 0)`;
      }

      function endDrag(x) {
        if (!dragging || startX === null) return;
        const delta = (x ?? pointerX ?? startX) - startX;
        dragging = false;
        startX = null;
        pointerX = null;
        document.body.classList.remove('dragging');
        deck.style.transform = '';
        if (Math.abs(delta) >= 50) go(current + (delta < 0 ? 1 : -1));
        else render({ updateHash: false });
      }

      viewport.addEventListener('mousedown', event => {
        if (event.button === 0) beginDrag(event.clientX);
      });
      window.addEventListener('mousemove', event => moveDrag(event.clientX));
      window.addEventListener('mouseup', event => endDrag(event.clientX));
      viewport.addEventListener('touchstart', event => beginDrag(event.changedTouches[0].clientX), { passive: true });
      viewport.addEventListener('touchmove', event => moveDrag(event.changedTouches[0].clientX), { passive: true });
      viewport.addEventListener('touchend', event => endDrag(event.changedTouches[0].clientX), { passive: true });

      function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
      fullscreen.addEventListener('click', toggleFullscreen);

      window.addEventListener('hashchange', () => {
        const requested = Number(location.hash.replace('#slide-', '')) - 1;
        if (Number.isInteger(requested) && requested >= 0 && requested < total) {
          current = requested;
          render({ updateHash: false });
        }
      });

      render({ updateHash: !location.hash });
    })();
  </script>
