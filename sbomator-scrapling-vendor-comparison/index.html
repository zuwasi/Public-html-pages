<script>
const data=JSON.parse(document.getElementById('report-data').textContent);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,label=url)=>`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;
const projects=data.projects;
const titles=[];
function slide(title,body){titles.push(title);document.getElementById('track').insertAdjacentHTML('beforeend',`<section class="slide" aria-label="${esc(title)}"><div class="inner">${body}</div></section>`)}
const sourceLinks=e=>`${link(e.source_url)}${e.board_evidence?link(e.board_evidence.source_url):''}`;
slide('Verdict',`<div class="eyebrow">9 public repositories · 18 actual scans · 3 silicon ecosystems</div>
<h1>Better vendor evidence.<br><span class="accent">Not a better inventory.</span></h1>
<p class="lead">Does Scrapling help SBOMator? Yes, as an optional collector for hardware lifecycle evidence. In this experiment it did not discover a single additional software component.</p>
<div class="stats"><div class="card"><div class="metric">3 × 3</div><div class="label">NXP · ST · AMD/Xilinx</div></div><div class="card"><div class="metric">9 / 9</div><div class="label">Component inventories unchanged</div></div><div class="card"><div class="metric">+0</div><div class="label">Software components added</div></div><div class="card warn"><div class="metric">1</div><div class="label">Board-obsolescence warning found</div></div></div>
<div class="alert"><strong>This is not a native “Scrapling on/off” switch.</strong> Two identical baseline scans per repository, followed by an experimental evidence attachment to the second output. Hardware targets were manually selected from pinned source files.</div>
<a class="btn" href="scan-artifacts.zip" download>Download all paired SBOMs</a><a class="btn" href="comparison.json" download>Download measured data</a><p id="hint">← Swipe to navigate →</p>`);
slide('All nine comparisons',`<div class="eyebrow">Measured outcome / click a project for evidence</div><h2>Same components. Additional context.</h2><p class="muted">Counts exclude the top-level product. “With” adds project-level vendor evidence, not extra component records.</p><div class="table-scroll"><table><thead><tr><th>Project / target</th><th>Without</th><th>With</th><th>Vendor commitment*</th><th>Scope / warning</th></tr></thead><tbody>${projects.map((p,i)=>`<tr><td><button class="rowbtn" data-go="${i+3}">${esc(p.id)}</button><br><small>${esc(p.target)}</small></td><td>${p.before_count}</td><td>${p.after_count}</td><td>${esc(p.evidence.commitment_until)}</td><td>${esc(p.evidence.match_level.replaceAll('_',' '))}${p.evidence.board_evidence?'<br><strong class="warning">Board: obsolete</strong>':''}</td></tr>`).join('')}</tbody></table></div><p class="small">*Commitment is not an EOL date, stock guarantee, or approval for every ordering code. K22 applicability remains conditional. The ST F7 date is for the MCU, not its obsolete board.</p><div class="alert"><strong>Six inventories contain zero components.</strong> This is a coverage limitation, not proof of zero dependencies. ST F4/H7 include unconfirmed RTOS heuristic detections; three scans retain unresolved quality-gate blockers.</div>`);
slide('Method and boundaries',`<div class="eyebrow">Reproducibility</div><h2>What “with Scrapling” actually means</h2><div class="grid"><div class="card"><h3>1. Freeze and scan</h3><ul><li>9 public repositories, commits pinned in every project slide.</li><li>SBOMator ${esc(data.scanner.version)}, existing dirty development tree; source hashes checked unchanged throughout.</li><li>Two comprehensive CLI scans per checkout with identical options.</li><li>Top-level sources only. No builds, no submodule checkout.</li></ul></div><div class="card good"><h3>2. Collect and attach</h3><ul><li>Scrapling ${esc(data.scrapling_version)} Fetcher, ordinary HTTP fetching, no browser or CAPTCHA handling.</li><li>Reviewed hardware query mappings; dates and quotes extracted from actual HTML rows.</li><li>Attach one <code>experiment:scrapling:project_hardware_evidence</code> metadata property to the second SBOM.</li><li>Preserve component fields and quality blockers exactly.</li></ul></div></div><p><code>--source-type local_folder --generator comprehensive --no-lockfile --skip-db-update --no-cve --no-grype --no-report</code></p><div class="alert">The baseline intentionally skips online lifecycle/CVE services. This tests adding vendor evidence to that baseline, not Scrapling versus every existing SBOMator online provider. CVE exposure and security posture were not assessed.</div><p class="small">The ZIP contains the first raw scan, second raw scan, and enriched second scan for each project. Inventory equality ignores component order only. Raw scan durations are recorded, but warm caches and concurrency prevent a valid scan-speed comparison.</p>`);
projects.forEach(p=>{
const e=p.evidence;
const issue=p.before_count===0?'Empty inventory: dependencies may be omitted.':p.id==='xilinx-zybo'?'vivado-library is an unpopulated submodule reference, not scanned source.':'Includes heuristic RTOS hits that are not validated runtime dependencies.';
slide(p.id,`<div class="eyebrow">${esc(p.vendor)} / ${esc(p.target)}</div><h2>${esc(p.repository.split('/').pop())}</h2><div class="repo">${link(p.repository)}Pinned commit: ${link(p.repository+'/commit/'+p.commit,p.commit)} · ${p.tracked_files} tracked files</div><div class="grid"><div class="card"><div class="compare-label">WITHOUT SCRAPLING / RAW SCANNER OUTPUT</div><h3>${p.before_count} software/model component records</h3><p>${esc(issue)}</p><p>Vendor webpage evidence: <strong>not collected</strong>.</p><p>Quality gate: <strong class="${p.blockers.length?'warning':''}">${esc(p.quality_status)}</strong>${p.blockers.length?' · '+p.blockers.length+' unresolved fields':''}.</p><p class="small">A gate pass on an empty inventory does not establish completeness. Advisory mode exported artifacts even when blocked.</p>${p.components.length?`<details><summary>Observed component names</summary><ul class="small">${p.components.map(c=>`<li>${esc(c.name)} · ${esc(c.version||'version missing')}</li>`).join('')}</ul></details>`:''}</div><div class="card ${e.board_evidence?'bad':'good'}"><div class="compare-label">WITH SCRAPLING / EXPERIMENTAL ENRICHMENT</div><h3>${p.after_count} components <span class="muted">→ no inventory change</span></h3><p>Vendor commitment: <strong class="accent">${esc(e.commitment_until)}</strong></p>${e.board_evidence?'<p class="warning"><strong>STM32F7508-DK board: obsolete / out of production.</strong><br>The date above applies to its STM32F750N8 MCU only.</p>':''}<span class="pill">${esc(e.match_level.replaceAll('_',' '))}</span><p>${esc(e.limitations)}</p><p class="small">No licenses, versions, security findings, or quality blockers were repaired.</p></div></div><div class="quote">“${esc(e.quote)}”${e.board_evidence?'<br>“'+esc(e.board_evidence.quote)+'”':''}</div><div class="sources">${sourceLinks(e)}</div><details><summary>Source identity and limitations</summary><p>${link(e.commit_source_url)}</p><code>${esc(e.repo_evidence.join('\n'))}</code>${p.vendor==='NXP'?'<p>The repository contains many devices. This target is one representative mapping, not coverage of the entire repository. Existing vendor SPDX documents were not automatically imported.</p>':''}${p.hbom?`<p>Supplemental HBOM: <strong>${esc(p.hbom.status)}</strong>${p.hbom.entries?' · '+p.hbom.entries+' design entries · quality '+p.hbom.quality_score+'/100':''}. ${esc(p.hbom.note)}</p>`:''}<p>Submodules: ${esc(p.submodules||'none recorded')}. Retrieved ${esc(e.retrieved_at)}.</p></details>`);
});
const trialRows=['nxp-longevity','st-longevity','amd-artix7','amd-zynq7000'].map(id=>{const ts=data.trials.filter(t=>t.source_id===id);return `<tr><td>${esc(id)}</td>${['requests','scrapling'].map(m=>{const x=ts.filter(t=>t.method===m);return `<td>${x.filter(t=>t.valid_content).length} / ${x.length}</td><td>${(x.reduce((n,t)=>n+t.seconds,0)/x.length).toFixed(2)} s</td>`}).join('')}</tr>`}).join('');
slide('HTTP retrieval experiment',`<div class="eyebrow">Separate experiment / default HTTP clients on this machine</div><h2>Scrapling reached more vendor pages.</h2><p class="lead">${data.trials.filter(t=>t.method==='scrapling'&&t.valid_content).length}/12 valid Scrapling responses versus ${data.trials.filter(t=>t.method==='requests'&&t.valid_content).length}/12 with Python requests.</p><div class="table-scroll"><table><thead><tr><th>Page</th><th>Requests valid</th><th>Mean elapsed*</th><th>Scrapling valid</th><th>Mean elapsed*</th></tr></thead><tbody>${trialRows}</tbody></table></div><div class="grid"><div class="card"><h3>Controlled</h3><p>Same four URLs, three trials per client, alternating order, 15-second timeout, no Scrapling retries. Success requires HTTP 200 and a relevant body marker.</p><p class="small">*Elapsed includes timeouts. It is not a successful-request latency comparison or an SBOM scan benchmark.</p></div><div class="card warn"><h3>Not proven</h3><p>Nine plain requests timed out. This does not prove anti-bot blocking. No tuned requests headers, alternative HTTP clients, other networks, or long-term reliability were compared.</p><p class="small">ST's product data required following its 10-year tab HTML endpoint. The 12-trial measurement covers the main page, not that extra endpoint or the board page.</p></div></div>`);
slide('HBOM and quality gaps',`<div class="eyebrow">Do not mistake successful export for complete coverage</div><h2>Scraping does not repair the BOM.</h2><div class="grid"><div class="card warn"><h3>Software inventory</h3><ul><li>All three NXP repositories, ST F7 BSP, Basys and Arty exported zero component inventories.</li><li>ST F4 and H7 each retain four blockers: three missing RTOS versions and one missing model license.</li><li>Zybo retains one missing submodule license.</li><li>Heuristic FreeRTOS, ThreadX and Zephyr detections require review. No dependency builds were validated.</li></ul></div><div class="card warn"><h3>Supplemental design HBOM</h3><ul><li>Basys: 19 records, quality 29/100. Arty: 8 records, quality 14/100. These include HDL entities and file hashes, not just physical parts.</li><li>Both required explicit <code>GPIO_demo</code> top selection, supported by the README and VHDL.</li><li>Zybo blocked: generated <code>system_wrapper</code> absent.</li><li>Part identity from Tcl was reviewed separately; procurement, exact ordering-code status and approval remain unresolved.</li></ul></div></div><div class="alert">The vendor evidence is attached at project metadata level because the standard SBOMs do not contain identified hardware components. It is not silently relabelled as authoritative component lifecycle data.</div>`);
slide('Product recommendation',`<div class="eyebrow">Decision for SBOMator</div><h2>Use it as an evidence collector,<br>with explicit review boundaries.</h2><div class="grid"><div class="card good"><h3>Useful now</h3><ul><li>Fetch official lifecycle, longevity and product-status pages when ordinary HTTP retrieval fails.</li><li>Preserve source URL, quote, retrieval timestamp, HTML hash and matching scope.</li><li>Surface contradictions such as obsolete board versus active MCU.</li></ul></div><div class="card"><h3>Required before integration</h3><ul><li>Resolve exact manufacturer part numbers before applying component-level status.</li><li>Separate family, base-part, full ordering-code and board evidence.</li><li>Prefer official APIs/downloads; respect site terms and rate limits. Cache evidence and flag stale or changed rows.</li><li>Do not infer EOL, CVEs or procurement approval from availability commitments.</li></ul></div></div><p class="lead">Recommended: an optional HBOM enrichment adapter. Not a replacement for dependency discovery, SPDX import, license analysis, vendor advisories, or supplier confirmation.</p><a class="btn" href="scan-artifacts.zip" download>Download 27 SBOM artifacts + data</a><a class="btn" href="comparison.json" download>Evidence, hashes and trials</a><p class="small">Results reflect the selected source-only checkouts and vendor pages as retrieved on 21 September 2026. No native product code was changed.</p>`);
const slides=[...document.querySelectorAll('.slide')],jump=document.getElementById('jump');
titles.forEach((title,i)=>jump.add(new Option(`${i+1}. ${title}`,i)));
let current=0;
function go(n){current=Math.max(0,Math.min(slides.length-1,n));document.getElementById('track').style.transform=`translateX(-${current*100}vw)`;slides.forEach((s,i)=>{s.inert=i!==current;s.setAttribute('aria-hidden',String(i!==current))});jump.value=current;document.getElementById('prev').hidden=current===0;document.getElementById('next').hidden=current===slides.length-1;document.getElementById('counter').textContent=`${current+1} / ${slides.length}`;document.getElementById('progress').style.width=`${(current+1)/slides.length*100}%`;if(current)document.getElementById('hint').hidden=true;history.replaceState(null,'',`#${current+1}`)}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);jump.onchange=()=>go(Number(jump.value));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));
document.addEventListener('keydown',e=>{if(e.target.closest('select,input,textarea,button,a,summary'))return;if(['ArrowRight','ArrowLeft',' '].includes(e.key)){e.preventDefault();go(current+(e.key==='ArrowLeft'?-1:1))}});
let start=null;
function begin(x,y,target){start=target.closest('a,button,select,summary,.table-scroll')?null:{x,y}}
function end(x,y){if(start&&Math.abs(x-start.x)>50&&Math.abs(x-start.x)>Math.abs(y-start.y))go(current+(x<start.x?1:-1));start=null}
document.addEventListener('touchstart',e=>begin(e.touches[0].clientX,e.touches[0].clientY,e.target),{passive:true});document.addEventListener('touchend',e=>end(e.changedTouches[0].clientX,e.changedTouches[0].clientY),{passive:true});document.addEventListener('mousedown',e=>{if(e.button===0)begin(e.clientX,e.clientY,e.target)});document.addEventListener('mouseup',e=>{if(e.button===0)end(e.clientX,e.clientY)});
go(Number(location.hash.slice(1))-1||0);
</script>
