<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="ESL SBOMator FDA Edition: submission-ready Section 524B evidence for medical-device cybersecurity, SBOM, VEX, HBOM, DataBOM and postmarket monitoring.">
  <meta property="og:title" content="SBOMator FDA Edition — Medical Device Cybersecurity">
  <meta property="og:description" content="From shipped build to submission-ready Section 524B evidence.">
  <meta property="og:image" content="assets/page-01.webp">
  <meta property="og:type" content="website">
  <title>SBOMator FDA Edition | ESL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f3f7fb;
      --muted: #9bb0c1;
      --navy: #07111f;
      --panel: #102237;
      --blue: #00d9ff;
      --red: #f24b55;
      --gold: #ffb21a;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(0, 217, 255, .13), transparent 27%),
        radial-gradient(circle at 88% 82%, rgba(242, 75, 85, .12), transparent 25%),
        var(--navy);
      font-family: Inter, system-ui, sans-serif;
      cursor: grab;
      user-select: none;
    }
    body.dragging { cursor: grabbing; }

    .track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform .5s cubic-bezier(.22, .8, .24, 1);
      will-change: transform;
    }

    .slide {
      flex: 0 0 100vw;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 52px 76px 48px;
    }

    .page {
      display: block;
      width: auto;
      max-width: calc(100vw - 152px);
      height: calc(100vh - 100px);
      max-height: calc(100vh - 100px);
      object-fit: contain;
      background: white;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .46);
    }

    .topbar {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .09);
      background: rgba(5, 15, 27, .86);
      backdrop-filter: blur(12px);
    }
    .brand { min-width: 0; font-size: clamp(.72rem, 1.4vw, .88rem); font-weight: 800; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand span { color: var(--blue); }
    .top-actions { display: flex; flex: 0 0 auto; gap: 8px; }
    .download {
      flex: 0 0 auto;
      padding: 7px 11px;
      border: 1px solid rgba(0, 217, 255, .55);
      border-radius: 8px;
      color: var(--blue);
      background: rgba(0, 217, 255, .07);
      font-size: .72rem;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    .download:hover { color: var(--navy); background: var(--blue); }

    .nav {
      position: fixed;
      z-index: 11;
      top: 50%;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 50%;
      color: white;
      background: rgba(9, 27, 44, .82);
      box-shadow: 0 8px 20px rgba(0, 0, 0, .28);
      font-size: 29px;
      line-height: 1;
      transform: translateY(-50%);
      cursor: pointer;
      transition: opacity .2s, transform .2s, background .2s;
    }
    .nav:hover { background: var(--red); transform: translateY(-50%) scale(1.06); }
    .nav:disabled { opacity: 0; pointer-events: none; }
    .prev { left: 14px; }
    .next { right: 14px; }

    .progress {
      position: fixed;
      z-index: 12;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5px;
      background: rgba(255, 255, 255, .1);
    }
    .progress-fill { height: 100%; width: 10%; background: linear-gradient(90deg, var(--red), var(--gold), var(--blue)); transition: width .45s ease; }
    .counter { position: fixed; z-index: 12; right: 17px; bottom: 13px; color: var(--muted); font-size: .75rem; font-weight: 700; letter-spacing: .08em; }
    .hint { position: fixed; z-index: 12; left: 50%; bottom: 15px; color: var(--muted); font-size: .72rem; transform: translateX(-50%); animation: pulse 1.6s ease-in-out infinite; transition: opacity .3s; white-space: nowrap; }
    .hint.hidden { opacity: 0; pointer-events: none; }
    @keyframes pulse { 50% { opacity: .45; transform: translateX(-50%) translateY(-2px); } }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 700px) {
      .slide { padding: 52px 12px 62px; }
      .page { width: calc(100vw - 24px); height: auto; max-width: calc(100vw - 24px); max-height: calc(100vh - 116px); }
      .nav { top: auto; bottom: 16px; width: 40px; height: 40px; transform: none; font-size: 25px; }
      .nav:hover { transform: scale(1.04); }
      .prev { left: 12px; }
      .next { right: 12px; }
      .counter { right: 61px; bottom: 26px; }
      .hint { bottom: 30px; font-size: .64rem; }
      .download { padding: 6px 9px; font-size: .67rem; }
    }

    @media print {
      html, body { overflow: visible; background: white; }
      .track { display: block; transform: none !important; }
      .slide { width: 210mm; height: 297mm; padding: 0; break-after: page; }
      .page { width: 210mm; height: 297mm; max-width: none; max-height: none; box-shadow: none; }
      .topbar, .nav, .progress, .counter, .hint { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span>ESL</span> · SBOMator FDA Edition</div>
    <nav class="top-actions" aria-label="Page actions">
      <a class="download" href="../">Home</a>
      <a class="download" href="SBOMator_FDA_Edition.pdf" download>Download PDF</a>
    </nav>
  </header>

  <main class="track" id="track" aria-live="polite">
    <section class="slide" aria-label="Page 1 of 10: SBOMator FDA Edition cover"><img class="page" src="assets/page-01.webp" alt="SBOMator FDA Edition — submission-ready Section 524B medical-device cybersecurity evidence" fetchpriority="high"></section>
    <section class="slide" aria-label="Page 2 of 10: The Section 524B challenge"><img class="page" src="assets/page-02.webp" alt="The Section 524B challenge and FDA expectations for cyber devices" loading="lazy"></section>
    <section class="slide" aria-label="Page 3 of 10: SBOM and VEX evidence workflow"><img class="page" src="assets/page-03.webp" alt="SBOM plus VEX evidence workflow from shipped build to reviewable evidence" loading="lazy"></section>
    <section class="slide" aria-label="Page 4 of 10: Evidence report"><img class="page" src="assets/page-04.webp" alt="Generated Section 524B evidence report with compliance summary and remediation status" loading="lazy"></section>
    <section class="slide" aria-label="Page 5 of 10: AI/ML DataBOM"><img class="page" src="assets/page-05.webp" alt="CycloneDX 1.7 ML-BOM evidence, dataset provenance and privacy-review signals for AI and ML datasets" loading="lazy"></section>
    <section class="slide" aria-label="Page 6 of 10: Vulnerability intelligence"><img class="page" src="assets/page-06.webp" alt="CVSS 4.0 vulnerability intelligence with NVD, OSV, Grype, CISA KEV and EPSS" loading="lazy"></section>
    <section class="slide" aria-label="Page 7 of 10: Dashboard and AI triage"><img class="page" src="assets/page-07.webp" alt="SBOMator dashboard and controlled Droid-as-Judge AI vulnerability triage workflow" loading="lazy"></section>
    <section class="slide" aria-label="Page 8 of 10: MPSoC HBOM"><img class="page" src="assets/page-08.webp" alt="Product-scoped MPSoC HBOM linking Vivado, HLS, bitstream, HDL, firmware and software evidence" loading="lazy"></section>
    <section class="slide" aria-label="Page 9 of 10: Continuous monitoring"><img class="page" src="assets/page-09.webp" alt="Continuous monitoring and postmarket cybersecurity evidence" loading="lazy"></section>
    <section class="slide" aria-label="Page 10 of 10: Build your FDA evidence"><img class="page" src="assets/page-10.webp" alt="SBOMator FDA Edition capabilities and ESL contact details" loading="lazy"></section>
  </main>

  <button class="nav prev" id="prev" aria-label="Previous page">‹</button>
  <button class="nav next" id="next" aria-label="Next page">›</button>
  <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>
  <div class="counter" id="counter" aria-label="Page counter">1 / 10</div>
  <div class="hint" id="hint">← Swipe to navigate →</div>
  <div class="sr-only" id="announcement" aria-live="polite"></div>

  <script>
    (() => {
      const total = 10;
      const track = document.getElementById('track');
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      const progress = document.getElementById('progress');
      const counter = document.getElementById('counter');
      const hint = document.getElementById('hint');
      const announcement = document.getElementById('announcement');
      let index = Math.max(0, Math.min(total - 1, Number(location.hash.slice(1)) - 1 || 0));
      let startX = null;

      function show(target, userAction = true) {
        index = Math.max(0, Math.min(total - 1, target));
        track.style.transform = `translateX(-${index * 100}vw)`;
        prev.disabled = index === 0;
        next.disabled = index === total - 1;
        progress.style.width = `${((index + 1) / total) * 100}%`;
        counter.textContent = `${index + 1} / ${total}`;
        announcement.textContent = `Page ${index + 1} of ${total}`;
        history.replaceState(null, '', `#${index + 1}`);
        if (userAction && index > 0) hint.classList.add('hidden');
      }

      prev.addEventListener('click', () => show(index - 1));
      next.addEventListener('click', () => show(index + 1));
      addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') show(index - 1);
        if (event.key === 'ArrowRight' || event.key === ' ') { event.preventDefault(); show(index + 1); }
        if (event.key === 'Home') show(0);
        if (event.key === 'End') show(total - 1);
      });

      function begin(x) { startX = x; document.body.classList.add('dragging'); }
      function end(x) {
        document.body.classList.remove('dragging');
        if (startX === null) return;
        const distance = x - startX;
        startX = null;
        if (Math.abs(distance) < 50) return;
        show(index + (distance < 0 ? 1 : -1));
      }
      addEventListener('touchstart', event => begin(event.changedTouches[0].clientX), { passive: true });
      addEventListener('touchend', event => end(event.changedTouches[0].clientX), { passive: true });
      addEventListener('mousedown', event => { if (!event.target.closest('a,button')) begin(event.clientX); });
      addEventListener('mouseup', event => end(event.clientX));
      addEventListener('blur', () => { startX = null; document.body.classList.remove('dragging'); });
      addEventListener('hashchange', () => show(Number(location.hash.slice(1)) - 1 || 0, false));
      show(index, false);
    })();
  </script>
</body>
</html>
