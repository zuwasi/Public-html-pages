<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESL · Apollo Linker Benchmark — when mold helps, when it doesn't</title>
<style>
:root{
  --bg:#080d18;
  --bg-1:#0f1828;
  --bg-2:#15233a;
  --bg-3:#1b2c46;
  --line:#213452;
  --line-soft:#1a2740;
  --lnk:#0d6e62;
  --cyn:#00d4a8;
  --cyn-2:#22b9b3;
  --cyn-3:#1ea0c3;
  --amb:#f7b955;
  --mag:#ec5d8b;
  --red:#ff7e6b;
  --grn:#7be36b;
  --txt:#e6edf3;
  --txt-2:#aebccb;
  --txt-3:#7a8a9c;
  --shr:#0a3052;
  --bd-shadow:0 12px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04) inset;
  --font-mono:'JetBrains Mono','Cascadia Code','Fira Code',Menlo,Consolas,'Liberation Mono',monospace;
  --font-sans:'Inter','Segoe UI',-apple-system,system-ui,'Helvetica Neue',Helvetica,sans-serif;
  --font-display:'Century Gothic','Avenir Next','Futura','Trebuchet MS',sans-serif;
  --font-serif:'IBM Plex Serif','Crimson Text',Georgia,serif;
}
[data-theme='light']{
  --bg:#f0eee5;
  --bg-1:#fefdf8;
  --bg-2:#f5efe0;
  --bg-3:#ece4cd;
  --line:#cdc4ad;
  --line-soft:#e1d9c4;
  --lnk:#0a5a73;
  --cyn:#006b48;
  --cyn-2:#0e6a6a;
  --cyn-3:#066d8c;
  --amb:#b56400;
  --mag:#9b2d5e;
  --red:#a73c2c;
  --grn:#3b8a35;
  --txt:#1a1108;
  --txt-2:#3d3320;
  --txt-3:#6a5d44;
  --bd-shadow:0 12px 40px rgba(80,60,30,0.15),0 0 0 1px rgba(0,0,0,0.04) inset;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font-sans);transition:background .25s ease,color .25s ease}
svg text{font-family:var(--font-mono);fill:var(--txt)}
[data-theme='light'] svg text{fill:#1a1108}

.deck{width:100vw;height:100vh;position:relative}
.slide{
  position:absolute;inset:0;
  display:none;
  flex-direction:column;
  padding:88px 120px 64px 120px;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 20% 0%, rgba(34,185,179,.07) 0%, transparent 45%),
    radial-gradient(circle at 80% 100%, rgba(0,212,168,.06) 0%, transparent 50%);
  overflow:hidden;
}
[data-theme='light'] .slide{
  background-image:
    radial-gradient(circle at 20% 0%, rgba(10,90,115,.06) 0%, transparent 45%),
    radial-gradient(circle at 80% 100%, rgba(0,141,98,.06) 0%, transparent 50%);
}
.slide.active{display:flex;animation:fade .42s cubic-bezier(.2,.7,.2,1)}
@keyframes growBar{to{transform:none}}
@keyframes fade{
  0%{opacity:0;transform:translateY(8px)}
  100%{opacity:1;transform:none}
}

.slide-grid{display:grid;flex:1;gap:18px;min-height:0}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1.4fr 1fr 1fr}
.grid-35{grid-template-columns:3fr 5fr}
.grid-53{grid-template-columns:5fr 3fr}

.card{background:var(--bg-1);border:1px solid var(--line);border-radius:6px;padding:18px 22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--bd-shadow);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--cyn),transparent);opacity:.7}
.card.no-accent::before{display:none}
.card h3{margin:0 0 6px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyn);font-weight:600}
.card p{margin:0;font-size:14px;color:var(--txt-2);line-height:1.6}

h1.title{margin:0 0 4px;font:800 64px/1.02 var(--font-display);letter-spacing:-.02em;color:var(--txt)}
h1.title .em{color:var(--cyn)}
h2{margin:0 0 6px;font:700 36px/1.05 var(--font-display);letter-spacing:-.012em;color:var(--txt)}
h2 .em{color:var(--cyn)}
h3.eyebrow{margin:0 0 12px;font:600 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--cyn-3)}
.lead{font:400 18px/1.55 var(--font-sans);color:var(--txt-2);max-width:880px}
.kicker{font:600 12px/1 var(--font-mono);color:var(--cyn);letter-spacing:.18em;text-transform:uppercase}
.byline{font:400 13px/1.4 var(--font-sans);color:var(--txt-3)}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{background:var(--bg-1);border:1px solid var(--line);border-radius:6px;padding:14px 18px;position:relative;overflow:hidden}
.stat .label{font:600 11px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);margin-bottom:8px}
.stat .v{font:700 34px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--cyn)}
.stat .v small{font-size:14px;color:var(--txt-3);font-weight:400;margin-left:6px;letter-spacing:0}
.stat .delta{font:600 11px/1 var(--font-mono);color:var(--txt-3);margin-top:6px}
.stat .delta.up{color:var(--grn)}
.stat .delta.down{color:var(--mag)}
.stat .delta.flat{color:var(--txt-3)}

table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 10.5px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;text-align:left;color:var(--cyn);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--bg-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:var(--txt);font-family:var(--font-mono);font-size:12.5px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-2)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.green{color:var(--grn)}
td.red{color:var(--mag)}
td.amber{color:var(--amb)}
td.mono-name{font-family:var(--font-mono);font-size:11.5px;color:var(--txt-2);max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

pre{background:#050a14;padding:14px 18px;border-radius:6px;border:1px solid var(--line);font:12.5px/1.6 var(--font-mono);color:var(--txt);overflow:hidden;margin:0}
[data-theme='light'] pre{background:#0c1828;color:#cdd9e6;border-color:#aaa}
[data-theme='light'] pre .c{color:#7a8a9c}
[data-theme='light'] pre .k{color:var(--amb)}
[data-theme='light'] pre .s{color:#a3e635}
[data-theme='light'] pre .a{color:var(--cyn-2)}
[data-theme='light'] pre .o{color:#7be3a3}
pre .c{color:#5d6e85}
pre .k{color:var(--amb)}
pre .s{color:#a3e635}
pre .a{color:var(--cyn-2)}
pre .o{color:#7be3a3}
pre .x{color:var(--mag)}

code.inline{background:var(--bg-2);padding:1px 6px;border-radius:3px;font-family:var(--font-mono);font-size:.86em;color:var(--cyn-2);border:1px solid var(--line-soft)}

.callout{
  border-left:3px solid var(--cyn);
  background:linear-gradient(90deg,rgba(0,212,168,.07),transparent);
  padding:14px 20px;
  border-radius:0 6px 6px 0;
  font-size:14px;color:var(--txt);
}
.callout.warn{border-left-color:var(--amb);background:linear-gradient(90deg,rgba(247,185,85,.08),transparent)}
.callout.bad{border-left-color:var(--mag);background:linear-gradient(90deg,rgba(236,93,139,.08),transparent)}
.callout strong{color:var(--txt)}

.ui{position:fixed;z-index:50;background:rgba(8,13,24,.72);border:1px solid var(--line);border-radius:999px;color:var(--txt);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(14px);transition:all .15s ease;-webkit-tap-highlight-color:transparent}
.ui:hover{background:var(--bg-2);color:var(--cyn);transform:scale(1.05)}
.ui:active{transform:scale(.95)}
[data-theme='light'] .ui{background:rgba(254,253,248,.85);color:var(--txt)}
[data-theme='light'] .ui:hover{background:var(--bg-2);color:var(--cyn)}
.ui.sq{border-radius:6px}

.ui-home{top:18px;left:18px;width:46px;height:46px}
.ui-prev{top:50%;left:16px;width:60px;height:60px;font-size:30px;font-weight:200;transform:translateY(-50%);font-family:var(--font-display)}
.ui-next{top:50%;right:16px;width:60px;height:60px;font-size:30px;font-weight:200;transform:translateY(-50%);font-family:var(--font-display)}
.ui-theme{top:18px;right:18px;width:46px;height:46px}
.ui-index{bottom:18px;right:18px;width:auto;height:36px;padding:0 14px;font-family:var(--font-mono);font-size:12px;letter-spacing:.14em}
.ui-progress{position:fixed;bottom:0;left:0;right:0;height:2px;background:var(--line-soft);z-index:45}
.ui-progress .bar{height:100%;background:linear-gradient(90deg,var(--cyn-3),var(--cyn));width:0;transition:width .3s ease}

/* Floating brand */
.brand{position:fixed;top:22px;left:78px;display:flex;align-items:center;gap:11px;z-index:30;pointer-events:none}
.brand .word{font:700 13px/1 var(--font-display);letter-spacing:.06em;color:var(--txt-2)}
.brand .word em{color:var(--cyn);font-style:normal}
.brand .amp{font:400 11px/1 var(--font-mono);letter-spacing:.18em;color:var(--txt-3);text-transform:uppercase;padding-left:10px;border-left:1px solid var(--line)}

.slide-tag{position:absolute;top:18px;right:80px;display:flex;align-items:center;gap:14px;z-index:10;pointer-events:none}
.slide-tag .n{font:600 12px/1 var(--font-mono);color:var(--cyn);letter-spacing:.12em}
.slide-tag .total{font:400 11px/1 var(--font-mono);color:var(--txt-3);letter-spacing:.04em}

.slide.cover{padding:0;align-items:stretch;justify-content:stretch}
.cover-grid{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%;position:relative}
.cover-left{padding:120px 60px 80px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);position:relative;background:linear-gradient(135deg,rgba(0,212,168,.04),transparent 60%)}
.cover-right{padding:80px 60px 80px;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(ellipse at center,rgba(34,185,179,.1),transparent 70%);position:relative}
[data-theme='light'] .cover-left{background:linear-gradient(135deg,rgba(0,107,72,.05),transparent 60%)}
[data-theme='light'] .cover-right{background:radial-gradient(ellipse at center,rgba(14,106,106,.07),transparent 70%)}

/* ESL logo: one image per theme */
.logo-img{display:inline-block;vertical-align:middle;width:auto}
.logo-light{display:none}
[data-theme='light'] .logo-dark{display:none}
[data-theme='light'] .logo-light{display:inline-block}
/* SVG monogram */
.mono{width:48px;height:48px;display:inline-block;vertical-align:middle}

/* CHARTY bits */
.barlist{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:170px 1fr 80px;gap:14px;align-items:center;font-family:var(--font-mono);font-size:13px;color:var(--txt-2)}
.bar-row .who{font-size:12.5px;color:var(--txt)}
.bar-row .bar-bg{height:22px;background:var(--bg-2);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.bar-row .bar-fg{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--cyn-3),var(--cyn));border-radius:2px;display:flex;align-items:center;padding-left:8px;font-size:11px;color:#0a1626;font-weight:700;width:0;transition:width 1.1s cubic-bezier(.3,.7,.2,1)}
.bar-row .bar-fg.mold{background:linear-gradient(90deg,var(--amb),var(--mag))}
.bar-row.v{font-size:12px;color:var(--cyn);font-weight:700}

.histogram{width:100%;height:280px}
.hgrid line{stroke:var(--line-soft);stroke-width:1}
.hgrid text{font-size:10.5px;fill:var(--txt-3);letter-spacing:.06em}
.hbar{transition:height .9s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.hbar:hover{filter:brightness(1.2)}

.scatter{width:100%;height:340px}
.scat-dot{transition:r .15s}
.scat-dot:hover{r:5}

.hist-fill{height:0}
@keyframes fillUp{to{height:var(--target-h)}}

/* Process row visualisation */
.proc-row{display:flex;gap:4px;align-items:flex-start;margin:4px 0}
.proc-pill{
  background:var(--bg-2);
  border:1px solid var(--line);
  border-radius:3px;
  padding:5px 9px;
  font:600 10.5px/1 var(--font-mono);
  color:var(--txt-3);
  text-transform:uppercase;
  letter-spacing:.06em;
}
.proc-pill.run{background:var(--cyn);color:var(--bg);border-color:var(--cyn)}
.proc-pill.link-bfd{background:linear-gradient(135deg,var(--cyn-3),var(--cyn));color:#0a1626;border-color:var(--cyn);animation:bfdrect 5s infinite}
.proc-pill.link-mold{background:linear-gradient(135deg,var(--amb),var(--mag));color:#0a1626;border-color:var(--mag);animation:moldrect 5s infinite}
@keyframes bfdrect{0%{transform:translateX(0)}100%{transform:translateX(0)}}
@keyframes moldrect{0%{transform:scale(.94);opacity:.78}50%{transform:scale(1);opacity:1}100%{transform:scale(.94);opacity:.78}}

.bar-anim{height:0;transition:height .9s cubic-bezier(.3,.7,.2,1)}

.ticker{font-feature-settings:'tnum';font-variant-numeric:tabular-nums;display:inline-block;min-width:3ch}
.ticker.in{animation:tickFade .8s ease}
@keyframes tickFade{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}

.ref{font-size:12.5px;font-style:italic;color:var(--txt-3);line-height:1.6}
.ref a{color:var(--cyn-2);text-decoration:none;border-bottom:1px dotted var(--cyn-3)}
.ref a:hover{color:var(--cyn);border-bottom-style:solid}

.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill-row .p{font:600 11px/1 var(--font-mono);letter-spacing:.06em;padding:5px 9px;border-radius:3px;background:var(--bg-2);border:1px solid var(--line);color:var(--txt-2);text-transform:uppercase}

.flow-graph{width:100%;height:100%}
.flow-graph .arrow path{stroke:var(--cyn);stroke-width:2;fill:none;marker-end:none;stroke-dasharray:6 4;animation:flow 1.5s linear infinite}
.flow-graph circle{stroke:var(--cyn-3);stroke-width:1.5;fill:var(--bg-1)}
.flow-graph rect.box{fill:var(--bg-1);stroke:var(--line);stroke-width:1.4;rx:4}
.flow-graph text{font:11px var(--font-mono);fill:var(--txt-2)}
.flow-graph text.tag{font:9.5px;fill:var(--txt-3);letter-spacing:.1em;text-transform:uppercase}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-20}}

.foot-foot{position:absolute;bottom:14px;left:120px;right:120px;display:flex;justify-content:space-between;align-items:center;font:11px/1 var(--font-mono);color:var(--txt-3);letter-spacing:.08em;text-transform:uppercase;z-index:5;pointer-events:auto}
.foot-foot a{color:var(--cyn-2);text-decoration:none;border-bottom:1px dotted transparent;text-transform:none;letter-spacing:.04em;font-size:12.5px}
.foot-foot a:hover{border-bottom-color:var(--cyn-3)}

hr.divide{border:none;border-top:1px dashed var(--line);margin:14px 0}

.dialog-list{display:flex;flex-direction:column;gap:14px;font-size:14px;color:var(--txt)}
.dialog-list dt{font:600 12.5px/1.3 var(--font-mono);color:var(--cyn-2);letter-spacing:.04em;margin:0 0 4px}
.dialog-list dd{margin:0;font:400 14px/1.55 var(--font-sans);color:var(--txt-2)}

.flag{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grn);margin-right:6px;vertical-align:middle}
.flag.warn{background:var(--amb)}
.flag.bad{background:var(--mag)}

.mini-bar{height:6px;border-radius:3px;background:var(--bg-2);position:relative;overflow:hidden}
.mini-bar .v{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cyn);border-radius:3px;transition:width 1.2s ease}

.slide-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.slide-head .crumbs{font:600 11px var(--font-mono);letter-spacing:.14em;color:var(--txt-3);text-transform:uppercase}
.slide-head .crumbs b{color:var(--cyn);font-weight:600}

@media (max-width:1200px){
  .slide{padding:68px 60px 56px}
  .ui-prev,.ui-next{width:48px;height:48px;font-size:24px}
  .cover-left{padding:80px 40px 60px}
  .cover-right{padding:60px 40px}
  h1.title{font-size:46px}
}
@media (max-width:880px){
  .slide{padding:60px 30px 50px}
  .ui-prev,.ui-next{width:40px;height:40px;font-size:22px}
  h1.title{font-size:36px}h2{font-size:24px}
  .grid-3{grid-template-columns:1fr}
}
</style>
</head>

// ============== Renderer ==============
const deck = document.getElementById('deck');
let current = 0;
const slides = [];
let slideTotal = 0;

function esc(s){return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function tick(el, target, dur=900, suffix='', factor=1, dec=0){
  const start = performance.now();
  function f(t){
    const k = Math.min((t - start)/dur, 1);
    const eased = 1 - Math.pow(1-k,3);
    el.textContent = (target*eased).toFixed(dec) + suffix;
    if (k<1) requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
}

function tally(parent, ms=900){
  // for stat numbers in any .v
  parent.querySelectorAll('.ticker[data-stop]').forEach(el=>{
    const stop = parseFloat(el.dataset.stop);
    const suf  = el.dataset.suf||'';
    const dec  = parseInt(el.dataset.dec||'0');
    tick(el, stop, ms, suf, 1, dec);
  });
  // animate bar fills
  parent.querySelectorAll('.mini-bar .v[data-stop]').forEach(el=>{
    setTimeout(()=>{ el.style.width = el.dataset.stop + '%'; }, 80);
  });
  // animate barlist
  parent.querySelectorAll('.bar-row .bar-fg[data-stop]').forEach(el=>{
    setTimeout(()=>{ el.style.width = el.dataset.stop + '%'; }, 150);
  });
  // sparse SVG rect bars (run1-wall)
  parent.querySelectorAll('svg rect[data-height]').forEach(el=>{
    const finalH = parseFloat(el.dataset.height);
    const dur = parseFloat(el.dataset.dur||'900');
    const start = performance.now();
    function f(t){
      const k = Math.min((t - start)/dur, 1);
      const eased = 1 - Math.pow(1-k,3);
      const h = finalH * eased;
      el.setAttribute('height', h.toFixed(2));
      // SVG rects grow downward from y; move y up so the bar rises from its baseline
      if (el.dataset.base) el.setAttribute('y', (parseFloat(el.dataset.base) - h).toFixed(2));
      if (k<1) requestAnimationFrame(f);
    }
    requestAnimationFrame(f);
  });
}

function slideHead(title, ey, crumb){
  return `
    <div class="slide-head">
      <div>
        <div class="eyebrow">${ey}</div>
        <h2>${title}</h2>
      </div>
      <div class="crumbs">${crumb}</div>
    </div>
  `;
}

SLIDES.push({
  id:'why',
  build(){
    return `
    <section class="slide">
      ${slideHead('Why we ran this benchmark', 'motivation', 'Apollo-Mobileye · cold bazel build')}
      <div class="slide-grid grid-2" style="align-items:start">
        <div class="card">
          <h3>The setup</h3>
          <p>Apollo-Mobileye (Baidu's autonomous-driving stack v9.0 with the Mobileye integration) is a Bazel
          workspace on the same Windows/WSL2 Linux dev box used by the team. A clean cold build currently takes
          about <code class="inline">460 s</code> on 24 cores. Apollo also produces around 320 link actions across its
          per-module <code class="inline">.so</code> tree, so the linker is a real question even though it's
          small relative to the 26 k compile actions.</p>
        </div>
        <div class="card">
          <h3>What we suspected</h3>
          <p>Rui Ueyama's August 2026 paper <a class="ref" href="https://arxiv.org/abs/2608.23228" target="_blank" rel="noopener noreferrer"
          style="color:var(--cyn-2);font-style:italic">arXiv:2608.23228</a> reports
          <strong>2.4–16.1 × over <code class="inline">lld</code></strong> and
          <strong>up to 112 × over <code class="inline">ld.bfd</code></strong> on multi-GiB debug binaries.
          Apollo doesn't look like one of those workloads — it has many small links, not one giant one.
          Without measuring we couldn't tell whether to bother.</p>
        </div>
      </div>
      <div class="callout" style="margin-top:14px">
        <strong>Premise.</strong>  We were <em>not</em> trying to prove mold is fast.  The Apollo-mobileye build is what it is;
        we changed exactly one knob (the system linker) and let the data speak.
      </div>
    </section>`;
  }
});

SLIDES.push({
  id:'mold',
  build(){
    return `
    <section class="slide">
      ${slideHead('<span class="em">mold</span> — a parallel-first linker', 'the alternative under test', 'arXiv:2608.23228 · Ueyama 2026')}
      <div class="slide-grid grid-35">
        <div class="card">
          <h3>What Rui actually changed</h3>
          <p>Most linkers inherited a sequential order-sensitive design from the 1970s:
          parse → resolve symbols in exactly one left-to-right pass → scan relocations →
          write the output. <span class="em" style="color:var(--cyn)">mold</span> decouples parsing
          from symbol resolution and parallelises every pass.</p>
          <pre><span class="c"># pseudo-data-parallel structure</span>
<span class="k">parallel_for</span>(input_files,  parse_elf)
<span class="k">parallel_for</span>(symbols,      atomically_resolve_owner)
<span class="k">parallel_for</span>(symbols,      liveness_walk_for_archives)
<span class="k">parallel_for</span>(sections,     gc_mark_then_relocations_scan)
<span class="k">parallel_for</span>(strings,      insert_into_concurrent_hashmap)
<span class="k">parallel_for</span>(sections,     two_level_layout_scan)
<span class="k">parallel_for</span>(output_4MiB,  blake3_merkle_two_level_hash)</pre>
        </div>
        <div class="card">
          <h3>The paper's headline</h3>
          <p class="lead" style="color:var(--cyn)">
            "mold links multi-gigabyte debug binaries in at most a few seconds, and often in under
            a second. It is 2.4–16.1 × faster than <code class="inline">lld</code>, and up to 112 × faster than the
            traditional <code class="inline">GNU ld</code>."
          </p>
          <p style="margin-top:8px">
            Table 3 in the paper: nine workloads, link outputs ranging from
            <strong>0.15&nbsp;GiB (Godot release) to 9.91&nbsp;GiB (TensorFlow debug)</strong>.
            That's the regime we're trying to predict Apollo into — at our scale.
          </p>
          <p class="ref">Source: <a href="https://arxiv.org/abs/2608.23228" target="_blank" rel="noopener noreferrer">arXiv:2608.23228</a> &nbsp;·&nbsp; MIT-style code &nbsp;·&nbsp;
          claim validated across 9 large open-source workloads.<br/>
          Section 4 (algorithm) · Section 7.5–7.6 (per-pass breakdown) · Appendix A (artifact).</p>
        </div>
      </div>
    </section>`;
  }
});

SLIDES.push({
  id:'symlink',
  build(){
    return `
    <section class="slide">
      ${slideHead('The <span class="em">symlink swap</span> trick', 'tooling choice', 'kgcc 7.5 · ld.bfd ⇒ ld.mold')}
      <div class="slide-grid grid-2">
        <div class="card">
          <h3>Why</h3>
          <p>Bazel auto-detects the C/C++ toolchain by reading the system <code class="inline">gcc</code>. Apollo's
          pass-through configuration does not pin a <em>linker</em>, so bazel uses
          <code class="inline">/usr/bin/x86_64-linux-gnu-ld</code> which we control.</p>
          <p>Symlinking <em>that ld</em> to <code class="inline">/usr/local/bin/ld.mold</code> is the smallest possible
          blast radius &mdash; we don't need clang, gcc plugin flags, or bazel rc edits. Two lines per pass.</p>
        </div>
        <div class="card">
          <h3>The exact two-line recipe</h3>
<pre><span class="c"># default Bazel cc_toolchain ld → ld.bfd (Apollo default)</span>
docker exec apollo_mold_test bash -c '
  rm -f /usr/bin/x86_64-linux-gnu-ld
  ln -sf /usr/bin/x86_64-linux-gnu-ld.bfd /usr/bin/x86_64-linux-gnu-ld
'

<span class="c"># mold pass → ld.mold is shipped in mold 2.x as a wrapper</span>
docker exec apollo_mold_test bash -c '
  rm -f /usr/bin/x86_64-linux-gnu-ld
  ln -sf /usr/local/bin/ld.mold /usr/bin/x86_64-linux-gnu-ld
'

<span class="c"># verify mold is reachable  </span>
ld.mold --version    <span class="c"># → mold 2.0.0 (de991b51…)</span>
readlink /usr/bin/x86_64-linux-gnu-ld</pre>
        </div>
      </div>
      <div class="callout warn" style="margin-top:14px">
        <strong>Caveat.</strong>  Apollo's <code class="inline">gcc&nbsp;7.5</code> also calls
        <code class="inline">/usr/bin/ld.gold</code> for LTO. We did not redirect that one — LTO is off in this run.
        If you ever turn on LTO you must also redirect <code class="inline">ld.gold</code> or set
        <code class="inline">-fno-lto</code>.
      </div>
    </section>`;
  }
});

// ============== Build deck ==============
function buildDeck(){
  deck.innerHTML = '';
  slides.length = 0;
  SLIDES.forEach((s,i)=>{
    // build() returns its own <section class="slide">; wrapping it would leave the inner section display:none
    const tpl = document.createElement('template');
    tpl.innerHTML = s.build().trim();
    let el = tpl.content.firstElementChild;
    if (!el || !el.classList.contains('slide')){
      el = document.createElement('section');
      el.className = 'slide';
      el.innerHTML = tpl.innerHTML;
    }
    el.id = 'slide-' + s.id;
    el.dataset.idx = i;
    deck.appendChild(el);
    slides.push(el);
  });
  slideTotal = slides.length;
  document.getElementById('slideTotal').textContent = String(slideTotal).padStart(2,'0');
  // Insert histogram if present
  slides.forEach(s=>{
    const tmpl = s.querySelector('#histData');
    const host = s.querySelector('#histHost');
    if (tmpl && host){
      host.innerHTML = tmpl.textContent;
    }
  });
}

function goto(idx){
  if (idx < 0) idx = 0;
  if (idx >= slides.length) idx = slides.length - 1;
  slides[current].classList.remove('active');
  current = idx;
  const s = slides[current];
  s.classList.add('active');
  tally(s, 900);
  document.getElementById('slideNum').textContent = String(current+1).padStart(2,'0');
  document.getElementById('progressBar').style.width = ((current+1)/slides.length*100) + '%';
  // Footer mini topic per slide
  const footTopic = document.getElementById('footTopic');
  if (footTopic){
    const topics = [
      'cover','why we bench','the Apollo project','mold in one slide','Rui\'s workload table',
      'our environment','engineering reality','the symlink trick','per-link instrumentation','Run 1 · wall-time',
      'why we re-ran','Apollo\'s link shape','per-link scatter','bucket analysis','where mold wins',
      'where mold loses','critical-path','the 1.5 s cliff','the bottom line','recommendations',
      'refs & method','end'
    ];
    footTopic.textContent = '#' + String(current+1).padStart(2,'0') + ' / ' + (topics[idx]||'apollo-mobileye benchmark');
  }
}

// ============== Theme toggle ==============
const themeBtn = document.getElementById('uiTheme');
const themeIcon = document.getElementById('themeIcon');
function setTheme(t){
  document.body.dataset.theme = t;
  if (t === 'dark'){
    themeIcon.innerHTML = '<path d="M21 12.8 A9 9 0 1 1 11.2 3 a7 7 0 0 0 9.8 9.8z"/>';
  } else {
    themeIcon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/>';
  }
}
setTheme('dark');
themeBtn.addEventListener('click', ()=>{
  setTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
});

// ============== Navigation ==============
document.getElementById('uiNext').addEventListener('click', ()=>goto(current+1));
document.getElementById('uiPrev').addEventListener('click', ()=>goto(current-1));
document.getElementById('uiHome').addEventListener('click', ()=>goto(0));
document.getElementById('uiIndex').addEventListener('click', ()=>goto(0));
window.addEventListener('keydown', (e)=>{
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); goto(current+1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goto(current-1); }
  else if (e.key === 'Home') { goto(0); }
  else if (e.key === 'End') { goto(slides.length-1); }
  else if (e.key === 't' || e.key === 'T') { setTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark'); }
});

// Init
buildDeck();
goto(0);
</script>
</body>
